<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ADP Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0000D0;
    --pink: #FF3184;
    --orange: #FF6D2E;
    --aqua: #43D8C9;
    --lightblue: #06CDFF;
    --purple: #AB76FF;
    --ink: #101024;
    --muted: #5A5A76;
    --rule: #E2E2EE;
    --paper: #FFFFFF;
    --wash: #F6F6FB;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--wash);
    color: var(--ink);
    font-family: Archivo, "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }

  .band { background: var(--blue); color: #fff; padding: 28px 24px 24px; }
  .band-inner, .sheet { max-width: 1080px; margin: 0 auto; }
  .band h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.015em; }
  .band .meta { margin-top: 6px; font-size: 13px; color: #C9C9FF; }

  .sheet { padding: 0 24px 64px; }
  section { margin-top: 36px; }

  h2 {
    margin: 0 0 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.01em;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }

  /* Filters */
  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: flex-end;
    gap: 14px;
    padding: 16px 0 4px;
  }

  .filter { display: block; }

  .filter span {
    display: block;
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .picker { position: relative; }

  .picker > summary {
    font-size: 13.5px;
    padding: 7px 28px 7px 10px;
    border: 1px solid var(--rule);
    background: var(--paper);
    min-width: 190px;
    cursor: pointer;
    list-style: none;
    position: relative;
  }

  .picker > summary::-webkit-details-marker { display: none; }

  .picker > summary::after {
    content: "";
    position: absolute;
    right: 11px;
    top: 14px;
    border: 4px solid transparent;
    border-top-color: var(--muted);
  }

  .picker[open] > summary { outline: 2px solid var(--blue); outline-offset: -1px; }

  .options {
    position: absolute;
    z-index: 20;
    top: calc(100% + 2px);
    right: 0;
    left: auto;
    min-width: 100%;
    max-height: 280px;
    overflow-y: auto;
    background: var(--paper);
    border: 1px solid var(--rule);
    box-shadow: 0 6px 18px rgba(16, 16, 36, 0.12);
    padding: 4px 0;
  }

  .options label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    font-size: 13.5px;
    white-space: nowrap;
    cursor: pointer;
  }

  .options label:hover { background: var(--wash); }
  .options input { accent-color: var(--blue); margin: 0; }

  .options .divider { border-top: 1px solid var(--rule); margin: 4px 0; }

  .filter select {
    font: inherit;
    font-size: 13.5px;
    padding: 7px 10px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    min-width: 190px;
  }

  .filter select:focus { outline: 2px solid var(--blue); outline-offset: -1px; }

  .reset {
    font: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--blue);
    cursor: pointer;
  }

  .reset:hover { background: var(--wash); }

  @media (max-width: 640px) {
    .filters { justify-content: flex-start; }
    .options { left: 0; right: auto; }
  }

  /* Hero */
  .hero {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 26px 28px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
    gap: 32px;
    align-items: center;
  }

  @media (max-width: 760px) {
    .hero { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  }

  .hero .figure {
    font-size: clamp(56px, 11vw, 84px);
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: -0.04em;
    color: var(--blue);
  }

  .hero .caption { margin-top: 8px; font-size: 14px; color: var(--muted); }

  .split {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 28px;
  }

  .split-value {
    display: block;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .split-label { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }

  .spark { width: 100%; height: 96px; display: block; }

  .spark-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: -0.01em;
  }

  .spark-caption { font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; }

  /* Metric tiles */
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(184px, 1fr));
    background: var(--rule);
    gap: 1px;
    border: 1px solid var(--rule);
  }

  .metric { background: var(--paper); padding: 16px 18px 18px; }
  .metric .label { font-size: 12.5px; color: var(--muted); min-height: 34px; }

  .metric .value {
    margin-top: 6px;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.025em;
  }

  .metric .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .note { margin-top: 10px; font-size: 12px; color: var(--muted); max-width: 72ch; }

  /* Breakdown bars */
  .breakdowns {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 24px;
  }

  @media (max-width: 760px) {
    .breakdowns { grid-template-columns: minmax(0, 1fr); }
  }

  .panel { background: var(--paper); border: 1px solid var(--rule); padding: 16px 20px 18px; }

  .panel h3 {
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  .row {
    display: grid;
    grid-template-columns: 150px minmax(0, 1fr) 46px 42px 46px;
    gap: 10px;
    align-items: center;
    padding: 5px 0;
  }

  .row .name {
    font-size: 13.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .row .name.dim { color: var(--muted); font-style: italic; }

  .row .track { background: var(--wash); height: 18px; }

  /* The bar's length is the row against the largest row; the segments inside it are
     that row's own gender split, so both read off one line. */
  .row .bar { display: flex; height: 18px; min-width: 2px; overflow: hidden; }
  .row .seg { display: block; height: 18px; }
  .row .seg.f { background: var(--pink); }
  .row .seg.m { background: var(--blue); }
  .row .seg.o { background: #C9C9DE; }

  .row .num { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  .row .num.f { color: var(--pink); }
  .row .num.m { color: var(--blue); }
  .row .num.all { font-weight: 600; }

  .row.head {
    padding: 0 0 4px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 4px;
  }

  .row.head .num {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .row.head .num.all { color: var(--muted); }

  .empty { font-size: 13px; color: var(--muted); padding: 10px 0; }

  .selection {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--muted);
    padding: 2px 0 0;
  }

  .chip {
    background: var(--blue);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    padding: 2px 9px;
  }

  .source {
    margin-top: 40px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
    font-size: 12px;
    color: var(--muted);
    max-width: 90ch;
  }

  .loading { padding: 48px 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<div class="band">
  <div class="band-inner">
    <h1>ADP Dashboard</h1>
    <div class="meta" id="meta">Loading</div>
  </div>
</div>

<div class="sheet">

  <div class="filters">
    <label class="filter">
      <span>Cost centre</span>
      <details class="picker" id="ccPicker">
        <summary id="ccSummary">All cost centres</summary>
        <div class="options" id="ccOptions"></div>
      </details>
    </label>

    <label class="filter">
      <span>Gender</span>
      <details class="picker" id="genderPicker">
        <summary id="genderSummary">All</summary>
        <div class="options" id="genderOptions"></div>
      </details>
    </label>

    <label class="filter">
      <span>Headcount as at</span>
      <select id="period"></select>
    </label>

    <button class="reset" id="reset" type="button">Reset</button>
  </div>

  <div class="selection" id="selection"></div>

  <div id="app" class="loading">Loading the figures</div>

</div>

<script>
(function () {
  "use strict";

  var DAY = 24 * 60 * 60 * 1000;
  var NOT_RECORDED = "Not recorded";

  var data = null;
  var state = { costCentres: [], genders: [], asOf: null };

  // ---------------------------------------------------------------- helpers

  function el(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function parseDay(s) {
    if (!s) return null;
    var d = new Date(s + (s.length === 10 ? "T00:00:00Z" : ""));
    return isNaN(d.getTime()) ? null : d;
  }

  /**
   * Same rule as the P&C dashboard: somebody who has not started yet is not headcount,
   * an Active employment status beats a stale termination date, and otherwise the
   * termination date decides.
   */
  function activeAt(p, when) {
    if (p._s && p._s > when) return false;
    if (p.a === 1) return true;
    if (!p._t) return true;
    return p._t > when;
  }

  function round1(n) {
    if (!isFinite(n)) return "0.0";
    return (Math.round(n * 10) / 10).toFixed(1);
  }

  function pct(part, whole) {
    if (!whole) return "0.0";
    return round1((part / whole) * 100);
  }

  function mean(values) {
    if (!values.length) return 0;
    var total = 0;
    for (var i = 0; i < values.length; i++) total += values[i];
    return total / values.length;
  }

  function median(values) {
    if (!values.length) return 0;
    var s = values.slice().sort(function (a, b) { return a - b; });
    var mid = Math.floor(s.length / 2);
    return s.length % 2 === 0 ? (s[mid - 1] + s[mid]) / 2 : s[mid];
  }

  /** Age in whole years at the given date, from a year-month of birth. */
  function ageAt(p, when) {
    if (!p._b) return null;
    var years = when.getUTCFullYear() - p._b.getUTCFullYear();
    if (when.getUTCMonth() < p._b.getUTCMonth()) years -= 1;
    if (years < 14 || years > 90) return null;
    return years;
  }

  /** Tenure in years, to one decimal. */
  function tenureAt(p, when) {
    if (!p._s) return null;
    var years = (when.getTime() - p._s.getTime()) / (365.25 * DAY);
    return years < 0 ? null : years;
  }

  // ---------------------------------------------------------------- filtering

  function selectedPeople() {
    var ccs = state.costCentres;
    var genders = state.genders;
    return data.people.filter(function (p) {
      if (ccs.length && ccs.indexOf(p.c) < 0) return false;
      if (genders.length && genders.indexOf(p.g) < 0) return false;
      return true;
    });
  }

  function asOfDate() {
    return state.asOf ? new Date(state.asOf) : new Date(data.asOf);
  }

  // ---------------------------------------------------------------- breakdown

  /**
   * Counts by one field, largest first, with "Not recorded" and "Other" pushed to the
   * bottom so they never lead a chart.
   */
  function breakdown(pool, field) {
    var counts = {};
    for (var i = 0; i < pool.length; i++) {
      var key = pool[i][field] || NOT_RECORDED;
      if (!counts[key]) counts[key] = { count: 0, female: 0, male: 0, other: 0 };
      counts[key].count += 1;
      if (pool[i].g === "Female") counts[key].female += 1;
      else if (pool[i].g === "Male") counts[key].male += 1;
      else counts[key].other += 1;
    }

    var rows = Object.keys(counts).map(function (k) {
      return {
        name: k,
        count: counts[k].count,
        female: counts[k].female,
        male: counts[k].male,
        other: counts[k].other
      };
    });

    rows.sort(function (a, b) {
      var rank = function (v) { return v === NOT_RECORDED ? 2 : v === "Other" ? 1 : 0; };
      return rank(a.name) - rank(b.name) || b.count - a.count || a.name.localeCompare(b.name);
    });

    return rows;
  }

  /**
   * Each row is one bar split by gender, so the mix reads off the same line as the total.
   * The bar length is the row's share of the largest row; the segments inside it are the
   * female, male and unrecorded shares of that row.
   */
  function renderBreakdown(title, rows, total, klass) {
    if (!rows.length) {
      return '<div class="panel"><h3>' + esc(title) + '</h3>' +
             '<div class="empty">Nobody matches this selection.</div></div>';
    }

    var max = 0;
    for (var i = 0; i < rows.length; i++) max = Math.max(max, rows[i].count);

    var html = '<div class="panel ' + (klass || "") + '"><h3>' + esc(title) + '</h3>' +
      '<div class="row head">' +
        '<div class="name"></div><div></div>' +
        '<div class="num f">Female</div>' +
        '<div class="num m">Male</div>' +
        '<div class="num all">All</div>' +
      '</div>';

    for (var j = 0; j < rows.length; j++) {
      var r = rows[j];
      var width = max > 0 ? Math.max((r.count / max) * 100, 1) : 1;
      var dim = (r.name === NOT_RECORDED || r.name === "Other") ? " dim" : "";
      var fPct = r.count ? (r.female / r.count) * 100 : 0;
      var mPct = r.count ? (r.male / r.count) * 100 : 0;
      var oPct = r.count ? (r.other / r.count) * 100 : 0;
      var tip = r.name + ": " + r.female + " female, " + r.male + " male" +
        (r.other ? ", " + r.other + " not recorded" : "") +
        " \u00b7 " + pct(r.count, total) + "% of the selection";

      html += '<div class="row" title="' + esc(tip) + '">' +
        '<div class="name' + dim + '">' + esc(r.name) + '</div>' +
        '<div class="track"><span class="bar" style="width:' + width.toFixed(2) + '%">' +
          '<i class="seg f" style="width:' + fPct.toFixed(2) + '%"></i>' +
          '<i class="seg m" style="width:' + mPct.toFixed(2) + '%"></i>' +
          '<i class="seg o" style="width:' + oPct.toFixed(2) + '%"></i>' +
        '</span></div>' +
        '<div class="num f">' + r.female + '</div>' +
        '<div class="num m">' + r.male + '</div>' +
        '<div class="num all">' + r.count + '</div>' +
        '</div>';
    }

    return html + '</div>';
  }

  // ---------------------------------------------------------------- trend

  function sparkline(points) {
    if (points.length < 2) return "";

    var w = 560, h = 96, pad = 8;
    var values = points.map(function (p) { return p.headcount; });
    var max = Math.max.apply(null, values);
    var min = Math.min.apply(null, values);
    if (max === min) { max = max + 1; min = Math.max(min - 1, 0); }

    var step = (w - pad * 2) / (points.length - 1);

    var coords = points.map(function (p, i) {
      var x = pad + i * step;
      var y = pad + (1 - (p.headcount - min) / (max - min)) * (h - pad * 2);
      return [x, y];
    });

    var line = coords.map(function (c, i) {
      return (i === 0 ? "M" : "L") + c[0].toFixed(1) + " " + c[1].toFixed(1);
    }).join(" ");

    var area = line + " L" + coords[coords.length - 1][0].toFixed(1) + " " + (h - pad) +
               " L" + coords[0][0].toFixed(1) + " " + (h - pad) + " Z";

    var dots = coords.map(function (c, i) {
      return '<circle cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="2.5" ' +
             'fill="var(--blue)"><title>' + esc(points[i].label) + ': ' +
             points[i].headcount + '</title></circle>';
    }).join("");

    var labels = points.map(function (p, i) {
      // Only every third month, or the strip is unreadable
      return (i % 3 === 0 || i === points.length - 1)
        ? '<span>' + esc(p.label.split(" ")[0]) + '</span>' : '<span></span>';
    }).join("");

    return '<div>' +
      '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" ' +
      'role="img" aria-label="Headcount over the last 24 months">' +
      '<path d="' + area + '" fill="rgba(0,0,208,0.08)"></path>' +
      '<path d="' + line + '" fill="none" stroke="var(--blue)" stroke-width="2.5" ' +
      'stroke-linejoin="round"></path>' + dots + '</svg>' +
      '<div class="spark-labels">' + labels + '</div>' +
      '<div class="spark-caption">Last twenty four months</div>' +
      '</div>';
  }

  // ---------------------------------------------------------------- render

  function render() {
    var pool = selectedPeople();
    var when = asOfDate();

    var active = pool.filter(function (p) { return activeAt(p, when); });

    var au = active.filter(function (p) { return p.e === "AU"; }).length;
    var uk = active.filter(function (p) { return p.e === "UK"; }).length;

    // ---- people metrics

    var ages = [];
    var tenures = [];
    for (var i = 0; i < active.length; i++) {
      var a = ageAt(active[i], when);
      if (a !== null) ages.push(a);
      var t = tenureAt(active[i], when);
      if (t !== null) tenures.push(t);
    }

    var female = active.filter(function (p) { return p.g === "Female"; }).length;

    // ---- trend, on the same selection

    var trend = data.months.map(function (m) {
      var end = new Date(m.iso);
      return {
        label: m.label,
        headcount: pool.filter(function (p) { return activeAt(p, end); }).length
      };
    });

    var html = "";

    // Hero
    html += '<section style="margin-top:20px">' +
      '<div class="hero">' +
        '<div>' +
          '<div class="figure">' + active.length + '</div>' +
          '<div class="caption">Headcount as at ' + esc(labelForAsOf()) + '</div>' +
          '<div class="split">' +
            '<span class="split-item"><span class="split-value">' + au + '</span>' +
              '<span class="split-label">ADP Australia</span></span>' +
            '<span class="split-item"><span class="split-value">' + uk + '</span>' +
              '<span class="split-label">ADP London</span></span>' +
          '</div>' +
        '</div>' +
        sparkline(trend) +
      '</div>' +
      '</section>';

    // People metrics
    html += '<section><h2>People metrics</h2><div class="metrics">' +
      tile("Average age", ages.length ? round1(mean(ages)) : "&ndash;",
           ages.length ? "years, from " + ages.length + " of " + active.length + " people" : "no dates of birth recorded") +
      tile("Average tenure", tenures.length ? round1(mean(tenures)) : "&ndash;",
           tenures.length ? "years" : "no start dates recorded") +
      tile("Median tenure", tenures.length ? round1(median(tenures)) : "&ndash;",
           tenures.length ? "years" : "") +
      tile("Female representation", pct(female, active.length) + "%",
           female + " of " + active.length) +
      '</div>';

    html += '</section>';

    // Breakdowns, every bar split by gender
    html += '<section><h2>Headcount by location</h2><div class="breakdowns">' +
      renderBreakdown("Location", breakdown(active, "l"), active.length, "") +
      renderBreakdown("Cost centre", breakdown(active, "c"), active.length, "") +
      '</div></section>';

    html += '<section><h2>Headcount by grade and discipline</h2><div class="breakdowns">' +
      renderBreakdown("Position grade", breakdown(active, "gr"), active.length, "") +
      renderBreakdown("Discipline", breakdown(active, "d"), active.length, "") +
      '</div></section>';

    el("app").className = "";
    el("app").innerHTML = html;

    renderSelection(pool.length, active.length);
  }

  function tile(label, value, sub) {
    return '<div class="metric"><div class="label">' + esc(label) + '</div>' +
      '<div class="value">' + value + '</div>' +
      (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>';
  }

  function labelForAsOf() {
    var key = state.asOf;
    for (var i = 0; i < data.months.length; i++) {
      if (data.months[i].iso === key) return data.months[i].label;
    }
    return data.asOfLabel;
  }

  function renderSelection(poolSize, activeSize) {
    var bits = [];
    if (state.costCentres.length) bits.push(state.costCentres.join(", "));
    if (state.genders.length) bits.push(state.genders.join(", "));

    if (!bits.length) {
      el("selection").innerHTML = "";
      return;
    }

    el("selection").innerHTML = '<span class="chip">Filtered</span>' +
      '<span>' + esc(bits.join(" &middot; ").replace(/&middot;/g, "·")) +
      ' &mdash; ' + activeSize + ' people</span>';
  }

  // ---------------------------------------------------------------- filters

  function buildCheckboxes(container, values, selected, onChange) {
    var html = '<label><input type="checkbox" data-all="1"' +
      (selected.length === 0 ? " checked" : "") + '> <strong>All</strong></label>' +
      '<div class="divider"></div>';

    for (var i = 0; i < values.length; i++) {
      html += '<label><input type="checkbox" value="' + esc(values[i]) + '"' +
        (selected.indexOf(values[i]) >= 0 ? " checked" : "") + '> ' + esc(values[i]) + '</label>';
    }

    container.innerHTML = html;

    container.addEventListener("change", function (ev) {
      var input = ev.target;
      if (input.tagName !== "INPUT") return;

      if (input.getAttribute("data-all")) {
        onChange([]);
        return;
      }

      var picked = [];
      var boxes = container.querySelectorAll('input[type=checkbox]:not([data-all])');
      for (var j = 0; j < boxes.length; j++) {
        if (boxes[j].checked) picked.push(boxes[j].value);
      }
      // Everything ticked means no filter at all, which keeps the summary honest
      onChange(picked.length === values.length ? [] : picked);
    });
  }

  function syncCheckboxes(container, selected, values) {
    var all = container.querySelector("input[data-all]");
    if (all) all.checked = selected.length === 0;
    var boxes = container.querySelectorAll('input[type=checkbox]:not([data-all])');
    for (var i = 0; i < boxes.length; i++) {
      boxes[i].checked = selected.length === 0 ? false : selected.indexOf(boxes[i].value) >= 0;
    }
  }

  function summarise(selected, allLabel, noun) {
    if (!selected.length) return allLabel;
    if (selected.length === 1) return selected[0];
    return selected.length + " " + noun;
  }

  function wireFilters() {
    var ccs = data.filterOptions.costCentres;
    var genders = data.filterOptions.genders;

    buildCheckboxes(el("ccOptions"), ccs, state.costCentres, function (picked) {
      state.costCentres = picked;
      syncCheckboxes(el("ccOptions"), picked, ccs);
      el("ccSummary").textContent = summarise(picked, "All cost centres", "cost centres");
      render();
    });

    buildCheckboxes(el("genderOptions"), genders, state.genders, function (picked) {
      state.genders = picked;
      syncCheckboxes(el("genderOptions"), picked, genders);
      el("genderSummary").textContent = summarise(picked, "All", "selected");
      render();
    });

    // Newest month first, because that is the one people want
    var opts = data.months.slice().reverse().map(function (m, i) {
      return '<option value="' + esc(m.iso) + '">' + esc(m.label) +
        (i === 0 ? " (current)" : "") + '</option>';
    }).join("");

    el("period").innerHTML = opts;
    state.asOf = data.months[data.months.length - 1].iso;
    el("period").value = state.asOf;

    el("period").addEventListener("change", function () {
      state.asOf = this.value;
      render();
    });

    el("reset").addEventListener("click", function () {
      state.costCentres = [];
      state.genders = [];
      state.asOf = data.months[data.months.length - 1].iso;

      syncCheckboxes(el("ccOptions"), [], ccs);
      syncCheckboxes(el("genderOptions"), [], genders);
      el("ccSummary").textContent = "All cost centres";
      el("genderSummary").textContent = "All";
      el("period").value = state.asOf;
      render();
    });

    // A picker left open over the figures is just in the way
    document.addEventListener("click", function (ev) {
      var pickers = document.querySelectorAll("details.picker[open]");
      for (var i = 0; i < pickers.length; i++) {
        if (!pickers[i].contains(ev.target)) pickers[i].removeAttribute("open");
      }
    });
  }

  // ---------------------------------------------------------------- start

  function start(payload) {
    data = payload;

    // Parse the dates once rather than on every filter change
    for (var i = 0; i < data.people.length; i++) {
      var p = data.people[i];
      p._s = parseDay(p.s);
      p._t = parseDay(p.t);
      p._b = p.b ? parseDay(p.b + "-01") : null;
    }

    var refreshed = new Date(data.generatedUtc);
    el("meta").textContent = "Headcount, age and tenure · refreshed " +
      refreshed.toLocaleString("en-AU", {
        day: "numeric", month: "short", year: "numeric",
        hour: "numeric", minute: "2-digit"
      });

    wireFilters();
    render();
  }

  // Absolute, so it resolves the same whether the page was opened as /team or /team/
  fetch("/team.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("team.json returned " + r.status);
      return r.json();
    })
    .then(start)
    .catch(function (err) {
      el("app").className = "";
      el("app").innerHTML = '<p class="note">The figures could not be loaded: ' +
        esc(err.message) + '. If this is the first deployment, the scheduled refresh ' +
        'has not run yet.</p>';
    });
})();
</script>

</body>
</html>
